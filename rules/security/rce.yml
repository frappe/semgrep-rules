rules:
- id: frappe-codeinjection-eval
  patterns:
  - pattern-not: eval("...")
  - pattern: eval(...)
  message: |
    Detected the use of eval(). eval() can be dangerous if used to evaluate
    dynamic content. Avoid it or use safe_eval().
  languages: [python]
  severity: ERROR

- id: frappe-ssti
  patterns:
  - pattern: render_template($ARG, ...)
  message: |
    Detected the use of render_template, make sure $ARG comes from trusted source.
  languages: [python]
  severity: WARNING
