rules:
  - id: missing-argument-type-hint
    languages: [python]
    severity: WARNING
    patterns:
      - pattern: |
          @frappe.whitelist(...)
          def $FUNC(..., $ARG, ...): ...
      - pattern-not: |
          @frappe.whitelist(...)
          def $FUNC(..., $ARG: $TYPE, ...): ...
      - metavariable-regex:
          metavariable: $ARG
          # Exclude 'self' and 'cls' as they typically don't take hints
          regex: ^(?!self$|cls$).*$
    message: "The argument '$ARG' in function '$FUNC' is missing a type hint."
